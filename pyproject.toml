[project]
name = "taxi-mlops"
version = "0.1.0"
description = "Reproducible NYC taxi-demand forecasting system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "mlflow>=3.18.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "shap>=0.54.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
