[project]
name = "taxi-mlops"
version = "0.1.0"
description = "Reproducible NYC taxi-demand forecasting system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"
