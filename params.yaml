data:
  taxi_type: yellow
  months: ["2020-01", "2020-02", "2020-03", "2020-04"]
  n_zones: 20
  source:
    citation: "NYC Taxi and Limousine Commission (TLC) Trip Record Data"
    info_page: "https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page"
    base_url: "https://d37ci6vzurychx.cloudfront.net"
    trip_data_path: "trip-data/{taxi_type}_tripdata_{month}.parquet"
    zone_lookup_path: "misc/taxi_zone_lookup.csv"

forecast:
  timezone: America/New_York
  horizon_hours: 1

# Boundaries are New York local midnight.
# Starts are inclusive; ends are exclusive.
periods:
  warmup:
    start: "2020-01-01"
    end: "2020-01-08"
  train:
    start: "2020-01-08"
    end: "2020-02-03"
  calibration:
    start: "2020-02-03"
    end: "2020-02-17"
  test:
    start: "2020-02-17"
    end: "2020-03-01"
  replay:
    start: "2020-03-01"
    end: "2020-05-01"

features:
  lags_hours: [1, 2, 3, 24, 168]
  rolling_windows_hours: [3, 24, 168]

# ADR-0009. Thresholds are provisional (standard PSI / Cohen's-effect-size
# conventions), not yet calibrated against the Feb 3-17 healthy window.
drift:
  reference_period: train
  window_hours: 168
  evaluation_cadence_hours: 1
  min_window_hours: 72
  persistence:
    min_state: 2
    required_consecutive_windows: 3
  weights:
    weekend_floor: 0.05
  thresholds:
    psi:
      warning: 0.10
      retrain: 0.25
    cohens_d:
      warning: 0.2
      retrain: 0.5
    cohens_w:
      warning: 0.1
      retrain: 0.3
    cohens_h:
      warning: 0.2
      retrain: 0.5
  adf:
    alpha: 0.05
    min_observations: 30

random_seed: 42
